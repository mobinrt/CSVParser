services:
  mysql:
    image: mysql:8.4
    container_name: csvparser-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: csvdb
      MYSQL_USER: csv
      MYSQL_PASSWORD: csv
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:4
    container_name: csvparser-adminer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  mysql_data:
